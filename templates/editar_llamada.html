{% extends 'base.html' %}

{% block titulo %}
Editar Llamada
{% endblock %}

{% block contenido %}

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">

                <i class="bi bi-telephone-fill text-primary"></i>

                Editar Llamada

            </h2>

            <p class="text-muted mb-0">

                Modifica la información de la llamada registrada.

            </p>

        </div>


        <a href="{{ url_for('llamadas') }}"
           class="btn btn-secondary rounded-pill">

            <i class="bi bi-arrow-left"></i>

            Regresar

        </a>

    </div>


    <div class="card shadow-sm border-0 rounded-4">

        <div class="card-body p-4">

            <form method="POST">


                <!-- FECHA Y HORA -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-calendar-event text-primary"></i>

                        Fecha y hora

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ llamada.fecha.strftime('%d/%m/%Y %H:%M') }}"
                        readonly>

                </div>


                <!-- CLIENTE -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-person-fill text-primary"></i>

                        Cliente

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ llamada.cliente.num_cliente }} - {{ llamada.cliente.nombre }}"
                        readonly>

                </div>


                <!-- VENDEDOR -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-person-badge-fill text-primary"></i>

                        Vendedor

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ llamada.usuario.nombre }}"
                        readonly>

                </div>


                <!-- ESTATUS -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-telephone text-primary"></i>

                        Estatus de la llamada

                    </label>

                    <select
                        name="estatus"
                        id="estatus"
                        class="form-select"
                        required>

                        <option
                            value="Contestó"
                            {% if llamada.estatus == 'Contestó' %}
                            selected
                            {% endif %}>

                            Contestó

                        </option>

                        <option
                            value="No contestó"
                            {% if llamada.estatus == 'No contestó' %}
                            selected
                            {% endif %}>

                            No contestó

                        </option>

                    </select>

                </div>


                <!-- MONTO -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-cash text-success"></i>

                        Monto Venta

                    </label>

                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        name="monto_venta"
                        id="monto_venta"
                        class="form-control"
                        value="{{ llamada.monto_venta or 0 }}"
                        placeholder="0.00">

                </div>


                <!-- OBSERVACIONES -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-chat-left-text text-primary"></i>

                        Observaciones

                    </label>

                    <textarea
                        name="observaciones"
                        class="form-control"
                        rows="4"
                        placeholder="Escribe comentarios sobre la llamada, acuerdos, seguimiento, etc.">{{ llamada.observaciones or '' }}</textarea>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn btn-success px-4 rounded-pill">

                    <i class="bi bi-check-circle"></i>

                    Guardar Cambios

                </button>


            </form>

        </div>

    </div>

</div>


<script>

const estatus =
document.getElementById("estatus");

const monto =
document.getElementById("monto_venta");


function actualizarMonto(){

    if(
        estatus.value === "No contestó"
    ){

        monto.value = "0";

        monto.disabled = true;

    }else{

        monto.disabled = false;

    }

}


estatus.addEventListener(
    "change",
    actualizarMonto
);


actualizarMonto();


// ==========================================
// VALIDAR ENVÍO
// ==========================================

document.querySelector("form")
.addEventListener(
    "submit",
    function(e){

        if(
            estatus.value === "No contestó"
        ){

            monto.disabled = false;

            monto.value = "0";

        }

    }
);

</script>

{% endblock %}
